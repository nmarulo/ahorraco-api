spring.application.name=ahorraco-api
server.port=8080
spring.jackson.default-property-inclusion=non_null
# Base de datos
spring.datasource.url=${DATASOURCE_URL:jdbc:mysql://localhost:3306/ahorraco?createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DATASOURCE_USER:root}
spring.datasource.password=${DATASOURCE_PASSWORD:nicolas}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.default-schema=${FLYWAY_DEFAULT_SCHEMA:ahorraco}
# Propiedades de la aplicación
app.http.path.prefix=/api
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}
app.web.base-url=${APP_WEB_BASE_URL:http://localhost:4200}
